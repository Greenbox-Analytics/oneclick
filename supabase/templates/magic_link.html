<!-- Supabase Auth "Magic Link" template. Same shell as every backend email
     (src/backend/orgs/emails.py _layout). Go-template variables filled by Supabase.
     Subject: Your sign-in link for Msanii -->
<div style="font-family: -apple-system, BlinkMacSystemFont, sans-serif; max-width: 560px; margin: 0 auto; padding: 32px 24px;">
  <div style="text-align: center; margin-bottom: 24px;">
    <h1 style="color: #1a3a2a; font-size: 24px; margin: 0;">Msanii</h1>
  </div>
  <p style="font-size: 16px; color: #333;">Hi, here's your sign-in link.</p>
  <p style="font-size: 15px; color: #555; line-height: 1.5;">
    Use the button below to sign in to Msanii as <strong>{{ .Email }}</strong>. No password needed.
  </p>
  <div style="text-align: center; margin: 32px 0;">
    <a href="{{ .ConfirmationURL }}"
       style="display: inline-block; background: #1a3a2a; color: white; padding: 14px 32px;
              border-radius: 8px; text-decoration: none; font-weight: 600; font-size: 15px;">
      Sign in to Msanii
    </a>
  </div>
  <p style="font-size: 13px; color: #999; text-align: center;">
    This link can only be used once. If you didn't request it, you can safely ignore this email — your account stays as it is.
  </p>
</div>
