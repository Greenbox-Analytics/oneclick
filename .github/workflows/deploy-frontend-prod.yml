name: Deploy Prod Frontend to Vercel

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  VERCEL_TOKEN: ${{ secrets.VERCEL_PROD_TOKEN }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  # IMPORTANT: this is the PROD Vercel project ID, separate from VERCEL_PROJECT_ID
  # which points at the dev project. Dev frontend deploys via Vercel's own
  # GitHub integration; this workflow handles the prod project explicitly.
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROD_PROJECT_ID }}

jobs:
  deploy:
    name: Build and Deploy Prod Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      # Links the project (.vercel/project.json) from VERCEL_ORG_ID /
      # VERCEL_PROJECT_ID. No longer used to fetch env for a local build.
      - name: Link Vercel project
        run: vercel pull --yes --environment=production --token=${{ env.VERCEL_TOKEN }}

      # Vercel builds from source — deliberately NOT `vercel build` + `--prebuilt`.
      # Prebuilt uploads carry finished output, which means (a) Vercel can't
      # re-run the build, so the dashboard Redeploy button is disabled and the
      # only way to pick up an env var change is re-running this workflow, and
      # (b) the build reads env via `vercel pull`, which cannot read values
      # marked Sensitive — those inline as `undefined` and ship a broken bundle
      # with no error. Building on Vercel avoids both. The release gate is
      # unchanged: this workflow still only runs on a `v*` tag or manual
      # dispatch, never on a merge to main.
      - name: Deploy to production
        id: deploy
        run: |
          DEPLOY_URL=$(vercel deploy --prod --token=${{ env.VERCEL_TOKEN }})
          echo "Deployed to: $DEPLOY_URL"
          echo "url=$DEPLOY_URL" >> $GITHUB_OUTPUT

      - name: Deployment Summary
        run: |
          echo "✅ Prod frontend deployment successful!"
          echo "🌐 URL: ${{ steps.deploy.outputs.url }}"
          echo "🏷️ Tag: ${{ github.ref_name }}"
