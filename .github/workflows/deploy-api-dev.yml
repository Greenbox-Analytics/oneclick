name: Deploy Dev API to Cloud Run

on:
  push:
    branches:
      - main
    paths:
      - 'src/backend/**'
      - '.github/workflows/deploy-api-dev.yml'
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  SERVICE_NAME: msanii-api-dev
  REGION: northamerica-northeast2
  IMAGE_NAME: gcr.io/${{ secrets.GCP_PROJECT_ID }}/msanii-api-dev
  # Public hostname the external ALB serves for this service. Setting it
  # switches the deploy to LB-only ingress and points the health check at
  # the load balancer. Leave it UNSET until scripts/setup-api-load-balancer.sh
  # has run and the LB actually answers — otherwise a deploy strands the
  # service behind a load balancer that does not exist yet.
  API_HOSTNAME: ${{ secrets.DEV_API_HOSTNAME }}

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Build and Deploy Dev API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT_EMAIL }}
          token_format: access_token

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GCR
        run: |
          gcloud auth configure-docker

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -t ${{ env.IMAGE_NAME }}:latest \
            ./src/backend

      - name: Push Docker image to GCR
        run: |
          docker push ${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker push ${{ env.IMAGE_NAME }}:latest

      - name: Clear conflicting env-var/secret types
        # Cloud Run errors if a key is set as both env-var and secret simultaneously.
        # List EVERY key that this deploy will (re)set, so we can flip back and forth
        # safely between env-var-typed and secret-typed values without manual cleanup.
        run: |
          gcloud run services update ${{ env.SERVICE_NAME }} \
            --region ${{ env.REGION }} \
            --remove-secrets ALLOWED_ORIGINS,VITE_FRONTEND_URL,VITE_BACKEND_API_URL,FRONTEND_URL,BYPASS_PAYWALLS,POSTHOG_ENABLED,POSTHOG_HOST,APP_ENV,OPS_NOTIFICATION_EMAIL,SLACK_CLIENT_ID,SLACK_CLIENT_SECRET,NOTION_CLIENT_ID,NOTION_CLIENT_SECRET,PAYPAL_ENV \
            --remove-env-vars INTEGRATION_ENCRYPTION_KEY,INTEGRATION_OAUTH_STATE_SECRET,GOOGLE_DRIVE_CLIENT_ID,GOOGLE_DRIVE_CLIENT_SECRET,DROPBOX_APP_KEY,DROPBOX_APP_SECRET,CREDENTIALS_AES_KEY,OPENAI_API_KEY,OPENAI_LLM_MODEL,OPENAI_LLM_MODEL_LARGE,RESEND_API_KEY,RESEND_FROM_EMAIL,ADMIN_EMAILS,TESTER_EMAILS,VITE_SUPABASE_URL,VITE_SUPABASE_ANON_KEY,VITE_SUPABASE_SECRET_KEY,STRIPE_SECRET_KEY,STRIPE_WEBHOOK_SECRET,STRIPE_PRICE_MONTHLY,STRIPE_PRICE_ANNUAL,POSTHOG_PROJECT_TOKEN,POSTHOG_PERSONAL_API_KEY,POSTHOG_PROJECT_ID,SPOTIFY_CLIENT_ID,SPOTIFY_CLIENT_SECRET,PAYPAL_CLIENT_ID,PAYPAL_CLIENT_SECRET 2>/dev/null || true

      - name: Resolve ingress mode
        id: ingress
        # `internal-and-cloud-load-balancing` closes the .run.app URL so only
        # the LB can reach the service. --allow-unauthenticated below stays
        # REQUIRED either way: ingress is the network gate, IAM is a separate
        # one, and a serverless NEG does not authenticate as a principal.
        run: |
          if [ -n "${{ env.API_HOSTNAME }}" ]; then
            echo "mode=internal-and-cloud-load-balancing" >> $GITHUB_OUTPUT
            echo "health=https://${{ env.API_HOSTNAME }}/health" >> $GITHUB_OUTPUT
          else
            echo "mode=all" >> $GITHUB_OUTPUT
            echo "health=" >> $GITHUB_OUTPUT
          fi

      - name: Deploy API to Cloud Run
        # Same image as the product backend, a separate service: PARTNER_API_ENABLED
        # arms the API routers AND the host lockdown (only the four tool routers'
        # own routes — /oneclick/v1/*, /registry/v1/*, /splitsheet/v1/*, /zoe/v1/*
        # — plus /health answer here), so this host can be wrapped in its own
        # domain and never serves the product surface. --timeout 600 covers a long
        # PDF parse; --concurrency 10 because each in-flight calculation holds a worker
        # thread for the whole LLM parse (Cloud Run's default 80 would queue dozens of
        # LLM runs behind the thread pool, so --max-instances alone bounds nothing).
        # 10 x 5 = 50 concurrent runs platform-wide — a calibration dial, not a law.
        #
        # Two flags split runtime config:
        #   --update-env-vars : non-secret config (URLs, toggles, model names).
        #                       Env-specific URLs come from GH secrets; toggles are literals.
        #   --update-secrets  : everything pulled from GSM at deploy time.
        #                       Most secrets reuse the same GSM name across dev+prod
        #                       (single Supabase/PostHog project, shared Stripe price IDs).
        #                       Only env-divergent secrets — STRIPE_SECRET_KEY,
        #                       STRIPE_WEBHOOK_SECRET, PAYPAL_CLIENT_ID,
        #                       PAYPAL_CLIENT_SECRET — use _DEV/_PROD suffixed GSM
        #                       names so the Cloud Run env var name stays unsuffixed.
        #                       PAYPAL_ENV is a literal toggle (live in prod, sandbox
        #                       in dev), not a secret.
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --region ${{ env.REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --ingress ${{ steps.ingress.outputs.mode }} \
            --port 8080 \
            --memory 1Gi \
            --cpu 1 \
            --timeout 600 \
            --max-instances 5 \
            --concurrency 10 \
            --min-instances 0 \
            --update-env-vars "^||^ALLOWED_ORIGINS=${{ secrets.DEV_ALLOWED_ORIGINS }}||VITE_FRONTEND_URL=${{ secrets.DEV_FRONTEND_URL }}||VITE_BACKEND_API_URL=${{ secrets.DEV_BACKEND_API_URL }}||FRONTEND_URL=${{ secrets.DEV_FRONTEND_URL }}||BYPASS_PAYWALLS=false||CREDITS_ENABLED=true||LICENSING_ENABLED=true||WORKSPACE_SCOPING_ENABLED=true||POSTHOG_ENABLED=true||POSTHOG_HOST=https://us.i.posthog.com||APP_ENV=dev||OPS_NOTIFICATION_EMAIL=tech@greenboxanalytics.ca||PAYPAL_ENV=sandbox||PARTNER_API_ENABLED=true" \
            --update-secrets VITE_SUPABASE_URL=VITE_SUPABASE_URL:latest,VITE_SUPABASE_ANON_KEY=VITE_SUPABASE_ANON_KEY:latest,VITE_SUPABASE_SECRET_KEY=VITE_SUPABASE_SECRET_KEY:latest,INTEGRATION_ENCRYPTION_KEY=INTEGRATION_ENCRYPTION_KEY:latest,INTEGRATION_OAUTH_STATE_SECRET=INTEGRATION_OAUTH_STATE_SECRET:latest,CREDENTIALS_AES_KEY=CREDENTIALS_AES_KEY:latest,GOOGLE_DRIVE_CLIENT_ID=GOOGLE_DRIVE_CLIENT_ID:latest,GOOGLE_DRIVE_CLIENT_SECRET=GOOGLE_DRIVE_CLIENT_SECRET:latest,DROPBOX_APP_KEY=DROPBOX_APP_KEY:latest,DROPBOX_APP_SECRET=DROPBOX_APP_SECRET:latest,OPENAI_API_KEY=OPENAI_API_KEY:latest,OPENAI_LLM_MODEL=OPENAI_LLM_MODEL:latest,OPENAI_LLM_MODEL_LARGE=OPENAI_LLM_MODEL_LARGE:latest,RESEND_API_KEY=RESEND_API_KEY:latest,RESEND_FROM_EMAIL=RESEND_FROM_EMAIL:latest,ADMIN_EMAILS=ADMIN_EMAILS:latest,TESTER_EMAILS=TESTER_EMAILS:latest,STRIPE_PRICE_MONTHLY=STRIPE_PRICE_MONTHLY:latest,STRIPE_PRICE_ANNUAL=STRIPE_PRICE_ANNUAL:latest,POSTHOG_PROJECT_TOKEN=POSTHOG_PROJECT_TOKEN:latest,POSTHOG_PERSONAL_API_KEY=POSTHOG_PERSONAL_API_KEY:latest,POSTHOG_PROJECT_ID=POSTHOG_PROJECT_ID:latest,STRIPE_SECRET_KEY=STRIPE_SECRET_KEY_DEV:latest,STRIPE_WEBHOOK_SECRET=STRIPE_WEBHOOK_SECRET_DEV:latest,SPOTIFY_CLIENT_ID=SPOTIFY_CLIENT_ID:latest,SPOTIFY_CLIENT_SECRET=SPOTIFY_CLIENT_SECRET:latest,PAYPAL_CLIENT_ID=PAYPAL_CLIENT_ID_DEV:latest,PAYPAL_CLIENT_SECRET=PAYPAL_CLIENT_SECRET_DEV:latest

      - name: Get Cloud Run URL
        id: get-url
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region ${{ env.REGION }} \
            --format 'value(status.url)')
          echo "Service deployed to: $SERVICE_URL"
          echo "url=$SERVICE_URL" >> $GITHUB_OUTPUT

      - name: Test health endpoint
        # Under LB-only ingress the .run.app URL stops answering by design, so
        # check the public hostname — which also proves DNS, the certificate and
        # the LB backend, not just that the container booted. Retried: a new
        # revision plus LB propagation is routinely slower than one sleep.
        run: |
          TARGET="${{ steps.ingress.outputs.health }}"
          [ -n "$TARGET" ] || TARGET="${{ steps.get-url.outputs.url }}/health"
          echo "Health check: $TARGET"
          for attempt in 1 2 3 4 5; do
            if curl -fsS --max-time 15 "$TARGET"; then
              echo "healthy on attempt $attempt"
              exit 0
            fi
            echo "attempt $attempt failed; retrying in 10s"
            sleep 10
          done
          echo "::error::$TARGET never returned 200"
          exit 1

      - name: Deployment Summary
        run: |
          echo "✅ Dev API deployment successful!"
          echo "🌐 Service URL: ${{ steps.get-url.outputs.url }}"
          echo "📦 Image: ${{ env.IMAGE_NAME }}:${{ github.sha }}"
          echo "🏷️ Commit: ${{ github.sha }}"

