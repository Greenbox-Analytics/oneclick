# Applies supabase/config.toml (auth settings, email templates, Resend SMTP)
# to the hosted Supabase project whenever it changes on main. This makes the
# repo the source of truth for auth config: a dashboard edit that drifts from
# the file will be overwritten on the next merge that touches these paths.
#
# Required repo secrets:
#   SUPABASE_ACCESS_TOKEN — personal access token (Supabase dashboard → Account → Access Tokens)
#   RESEND_API_KEY        — resolved into [auth.email.smtp].pass via env()
name: Push Supabase Config

on:
  push:
    branches: [main]
    paths:
      - "supabase/config.toml"
      - "supabase/templates/**"
  workflow_dispatch:

jobs:
  push-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Push config to hosted project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: supabase config push --project-ref sfugklkakdflrqhmkfps --yes
